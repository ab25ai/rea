<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="/manifest.json">
<title>Minz</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --text:#e8eaf0; --muted:#8b92a5; --accent:#6ea8fe; --me:#24324d; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, sans-serif;
         display: flex; flex-direction: column; padding-top: env(safe-area-inset-top); }
  header { padding: 12px 16px; font-weight: 600; border-bottom: 1px solid #232733; display:flex; justify-content:space-between; }
  header button { background: none; border: 0; color: var(--muted); font-size: 14px; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; background: var(--panel); }
  .me { align-self: flex-end; background: var(--me); }
  form { display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid #232733; }
  input { flex: 1; padding: 12px 14px; border-radius: 22px; border: 1px solid #2a2f3d; background: var(--panel); color: var(--text); font-size: 16px; }
  form button { padding: 0 18px; border-radius: 22px; border: 0; background: var(--accent); color: #0b1220; font-weight: 600; }
</style>
</head>
<body>
<header><span>Minz</span><button id="tok" type="button">Set token</button></header>
<div id="log"></div>
<form id="f"><input id="q" placeholder="Tell me what to do…" autocomplete="off"><button>Send</button></form>
<script>
const log = document.getElementById("log"), q = document.getElementById("q");
const getTok = () => { try { return localStorage.getItem("minz_token") || ""; } catch { return ""; } };
const setTok = v => { try { localStorage.setItem("minz_token", v); } catch {} };
function add(text, cls) { const d = document.createElement("div"); d.className = "msg " + (cls||""); d.textContent = text; log.appendChild(d); log.scrollTop = log.scrollHeight; return d; }
document.getElementById("tok").onclick = () => { const v = prompt("API token"); if (v !== null) setTok(v.trim()); };
document.getElementById("f").onsubmit = async e => {
  e.preventDefault();
  const text = q.value.trim(); if (!text) return;
  if (!getTok()) { document.getElementById("tok").click(); }
  q.value = ""; add(text, "me");
  const wait = add("…");
  try {
    const r = await fetch("/api/chat", { method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + getTok() },
      body: JSON.stringify({ message: text, session_id: "phone" }) });
    wait.textContent = r.ok ? (await r.json()).reply : "Error " + r.status;
  } catch (err) { wait.textContent = "Network error"; }
};
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
</script>
</body>
</html>
